
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie Hub - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Foodie Hub</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Food Menu</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="section">
        <h2>Contact Us</h2>

        <div class="contact-box">
            <p>Email: foodhub@example.com</p>
            <p>Phone: 0300-1234567</p>
            <p>We are happy to hear from you!</p>
        </div>

        <form id="contactForm" class="form-box">

            <label for="name">Your Name:</label>
            <input type="text" id="name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" required>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" required>

            <label for="contactMessage">Your Message:</label>
            <textarea id="contactMessage" rows="5" required></textarea>

            <button type="submit" class="order-btn">Send Message</button>

            <p id="contactResult"></p>

        </form>
    </section>

    <footer>
        <p>&copy; 2026 Foodie Hub. All rights reserved.</p>
    </footer>
    <!--Script-->
    <script>
    const contactForm = document.getElementById("contactForm");
    const contactResult = document.getElementById("contactResult");

    contactForm.addEventListener("submit", function(event) {
        event.preventDefault();
        contactResult.textContent ="Thank you! Your message has been entered successfully in this demo.";
        contactForm.reset();
        });
    </script>

</body>
</html>
